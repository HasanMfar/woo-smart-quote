    <g fill="url(#logoBgDark)">
      <path d="M 26 34 C 26 29 29 26 33 26 C 35 26 36 27 37 28 C 35 30 35 33 35 35 L 37 35 A 2 2 0 0 1 39 37 L 39 42 A 2 2 0 0 1 37 44 L 30 44 C 28 44 26 42 26 40 Z"/>
      <path d="M 41 34 C 41 29 44 26 48 26 C 50 26 51 27 52 28 C 50 30 50 33 50 35 L 52 35 A 2 2 0 0 1 54 37 L 54 42 A 2 2 0 0 1 52 44 L 45 44 C 43 44 41 42 41 40 Z"/>
    </g>

