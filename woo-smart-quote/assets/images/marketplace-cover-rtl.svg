<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" dir="rtl">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Mesh Glow Orbs -->
    <radialGradient id="orbViolet" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbEmerald" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base & Glows -->
  <rect width="800" height="500" rx="16" fill="url(#coverBg)"/>
  <rect width="800" height="500" fill="url(#orbViolet)"/>
  <rect width="800" height="500" fill="url(#orbEmerald)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.15">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Left Side: Interactive 3D Mark & Mockup Card -->
  <g transform="translate(100, 110)">
    <!-- Backing Glass Card -->
    <rect x="-30" y="-30" width="260" height="280" rx="28" fill="#1E293B" fill-opacity="0.6" stroke="#475569" stroke-width="1.2" stroke-opacity="0.5" filter="url(#cardShadow)"/>

    <!-- Mini Mockup Details on Glass Card -->
    <g transform="translate(0, 150)" opacity="0.9">
      <rect x="-10" y="0" width="220" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="10" cy="17" r="4" fill="#10B981"/>
      <text x="25" y="21" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">اتصال آنلاین: ربات بله و ایتا</text>
      <text x="195" y="21" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="10" font-weight="700" fill="#10B981">فعال</text>

      <rect x="-10" y="44" width="220" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="10" cy="61" r="4" fill="#6366F1"/>
      <text x="25" y="65" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">صدور PDF فارسی وزیرمتن</text>
      <text x="195" y="65" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="10" font-weight="700" fill="#818CF8">رسمی</text>
    </g>

    <!-- Central Floating App Icon -->
    <g transform="translate(35, 0)" filter="url(#markShadow)">
      <rect x="0" y="0" width="130" height="130" rx="36" fill="url(#markGrad)"/>
      <rect x="0.5" y="0.5" width="129" height="129" rx="35.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>

      <!-- Document Sheet -->
      <path d="M 36 24 L 78 24 L 96 42 L 96 102 A 6 6 0 0 1 90 108 L 36 108 A 6 6 0 0 1 30 102 L 30 30 A 6 6 0 0 1 36 24 Z" fill="#FFFFFF"/>
      <path d="M 78 24 L 78 38 A 4 4 0 0 0 82 42 L 96 42 Z" fill="#CBD5E1"/>

      <!-- Quotation marks -->
      <g fill="url(#markGrad)">
        <path d="M 42 50 C 42 43 46 39 52 39 C 55 39 57 41 58 42 C 55 45 55 49 55 52 L 58 52 A 3 3 0 0 1 61 55 L 61 62 A 3 3 0 0 1 58 65 L 48 65 C 45 65 42 62 42 59 Z"/>
        <path d="M 64 50 C 64 43 68 39 74 39 C 77 39 79 41 80 42 C 77 45 77 49 77 52 L 80 52 A 3 3 0 0 1 83 55 L 83 62 A 3 3 0 0 1 80 65 L 70 65 C 67 65 64 62 64 59 Z"/>
      </g>

      <!-- Content lines -->
      <rect x="42" y="73" width="46" height="4" rx="2" fill="#94A3B8"/>
      <rect x="42" y="82" width="32" height="4" rx="2" fill="#94A3B8" opacity="0.65"/>

      <!-- Spark Indicator Badge -->
      <circle cx="94" cy="94" r="17" fill="url(#sparkGrad)"/>
      <path d="M 95 85 L 88 94 L 93 94 L 92 103 L 100 93 L 95 93 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Right Side: Persian Typography & Selling Points -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Vazirmatn', 'IranSans', 'Segoe UI', Tahoma, sans-serif" direction="rtl">
    <!-- Category Tag -->
    <g transform="translate(680, 75)">
      <rect x="-140" y="0" width="140" height="28" rx="14" fill="#312E81" stroke="#4F46E5" stroke-width="1"/>
      <text x="-70" y="18" font-size="12" font-weight="700" fill="#C7D2FE" text-anchor="middle">افزونه تجاری ووکامرس</text>
    </g>

    <!-- Main Title -->
    <text x="680" y="150" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5">
      هوشمند استعلام قیمت
    </text>
    <text x="680" y="195" font-size="28" font-weight="800" fill="#A5B4FC" text-anchor="start" letter-spacing="-0.3">
      WooCommerce Smart Quote
    </text>

    <!-- Description -->
    <text x="680" y="240" font-size="14.5" font-weight="500" fill="#CBD5E1" text-anchor="start" opacity="0.9">
      سیستم جامع دریافت استعلام قیمت، صدور خودکار پیش‌فاکتور
    </text>
    <text x="680" y="265" font-size="14.5" font-weight="500" fill="#CBD5E1" text-anchor="start" opacity="0.9">
      رسمی PDF با فونت فارسی و ارسال فوری به بات بله و ایتا
    </text>

    <!-- Feature Checklist Pills -->
    <g transform="translate(680, 310)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <circle cx="-10" cy="-5" r="9" fill="#065F46"/>
        <path d="M -13 -5 L -11 -3 L -7 -7" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="-28" y="0" font-size="13.5" font-weight="600" fill="#F1F5F9" text-anchor="start">اتصال مستقیم و بدون واسطه به پیام‌رسان‌های ایرانی (بله و ایتا)</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 34)">
        <circle cx="-10" cy="-5" r="9" fill="#065F46"/>
        <path d="M -13 -5 L -11 -3 L -7 -7" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="-28" y="0" font-size="13.5" font-weight="600" fill="#F1F5F9" text-anchor="start">تولید پیش‌فاکتور استاندارد با مهر دیجیتال، بارکد و فونت رسمی</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 68)">
        <circle cx="-10" cy="-5" r="9" fill="#065F46"/>
        <path d="M -13 -5 L -11 -3 L -7 -7" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <text x="-28" y="0" font-size="13.5" font-weight="600" fill="#F1F5F9" text-anchor="start">تجربه کاربری بی‌نقص، بدون اصطکاک و ۱۰۰٪ بهینه‌شده برای موبایل</text>
      </g>
    </g>

    <!-- Bottom Market Badges -->
    <g transform="translate(680, 435)">
      <!-- Badge 1: HPOS -->
      <rect x="-95" y="0" width="95" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="-47.5" y="17" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">HPOS Ready</text>

      <!-- Badge 2: PHP 8.2+ -->
      <rect x="-195" y="0" width="90" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="-150" y="17" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">PHP 8.2+</text>

      <!-- Badge 3: Vazirmatn -->
      <rect x="-305" y="0" width="100" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="-255" y="17" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">فونت وزیرمتن</text>
    </g>
  </g>
</svg>