<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96">
  <defs>
    <!-- Background Gradient for LTR Logo Mark -->
    <linearGradient id="logoBgLTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="48%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0B234F"/>
    </linearGradient>

    <!-- White Chevron Gradient -->
    <linearGradient id="logoWhiteLTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Cyan Chevron Gradient -->
    <linearGradient id="logoCyanLTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="logoSparkLTR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="logoShadowLTR" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B192C" flood-opacity="0.35"/>
    </filter>

    <filter id="logoChvShadowLTR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#06152D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)" filter="url(#logoShadowLTR)">
    <!-- Squircle Base (84x84) -->
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#logoBgLTR)"/>
    <rect x="0.5" y="0.5" width="83" height="83" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Scaled Twin Persian Quotation Chevrons -->
    <g transform="translate(14, 14) scale(0.54)" filter="url(#logoChvShadowLTR)">
      <!-- Left Chevron (Pure White) -->
      <path d="M43 21 C44.8 19.3 47.7 20.3 48 22.8 L48 35.2 C48 36.6 47.3 37.9 46.1 38.7 L35.2 46.5 C33.8 47.5 33.8 49.5 35.2 50.5 L46.1 58.3 C47.3 59.1 48 60.4 48 61.8 L48 74.2 C47.7 76.7 44.8 77.7 43 76 L23.4 53.6 C21.5 51.5 21.5 48.5 23.4 46.4 Z" fill="url(#logoWhiteLTR)"/>
      <!-- Right Chevron (Electric Cyan) -->
      <path d="M69 21 C70.8 19.3 73.7 20.3 74 22.8 L74 35.2 C74 36.6 73.3 37.9 72.1 38.7 L61.2 46.5 C59.8 47.5 59.8 49.5 61.2 50.5 L72.1 58.3 C73.3 59.1 74 60.4 74 61.8 L74 74.2 C73.7 76.7 70.8 77.7 69 76 L49.4 53.6 C47.5 51.5 47.5 48.5 49.4 46.4 Z" fill="url(#logoCyanLTR)"/>
      <!-- Emerald Node -->
      <circle cx="78" cy="50" r="5.5" fill="url(#logoSparkLTR)"/>
      <circle cx="78" cy="50" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography Brand Text (Latin) -->
  <g transform="translate(108, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- "Smart" in clean dark slate -->
    <text x="0" y="47" font-size="32" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Smart</text>
    
    <!-- "Quote" in bold cobalt -->
    <text x="96" y="47" font-size="32" font-weight="800" fill="#1D4ED8" letter-spacing="-0.5">Quote</text>

    <!-- Badge Tag: "FOR WOOCOMMERCE" -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="138" height="20" rx="5" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="0.8"/>
      <text x="7" y="14" font-size="9.5" font-weight="700" fill="#0284C7" letter-spacing="1.2">FOR WOOCOMMERCE</text>
    </g>
    
    <text x="148" y="74" font-size="11.5" font-weight="600" fill="#64748B" letter-spacing="0.2">Official B2B Proforma Suite</text>
  </g>
</svg>
