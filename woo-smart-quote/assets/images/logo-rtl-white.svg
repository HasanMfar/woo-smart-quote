<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="460" height="96" dir="rtl">
  <defs>
    <!-- Background Gradient for RTL White Logo Mark -->
    <linearGradient id="logoBgRTLW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="48%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0B234F"/>
    </linearGradient>

    <!-- White Chevron Gradient -->
    <linearGradient id="logoWhiteRTLW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Cyan Chevron Gradient -->
    <linearGradient id="logoCyanRTLW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="logoSparkRTLW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="logoShadowRTLW" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="logoChvShadowRTLW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#06152D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Right Icon Mark (Positioned on the Right for RTL) -->
  <g transform="translate(366, 6)" filter="url(#logoShadowRTLW)">
    <!-- Squircle Base (84x84) -->
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#logoBgRTLW)"/>
    <rect x="0.5" y="0.5" width="83" height="83" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Scaled Twin Persian Quotation Chevrons -->
    <g transform="translate(14, 14) scale(0.54)" filter="url(#logoChvShadowRTLW)">
      <!-- Left Chevron (Pure White) -->
      <path d="M43 21 C44.8 19.3 47.7 20.3 48 22.8 L48 35.2 C48 36.6 47.3 37.9 46.1 38.7 L35.2 46.5 C33.8 47.5 33.8 49.5 35.2 50.5 L46.1 58.3 C47.3 59.1 48 60.4 48 61.8 L48 74.2 C47.7 76.7 44.8 77.7 43 76 L23.4 53.6 C21.5 51.5 21.5 48.5 23.4 46.4 Z" fill="url(#logoWhiteRTLW)"/>
      <!-- Right Chevron (Electric Cyan) -->
      <path d="M69 21 C70.8 19.3 73.7 20.3 74 22.8 L74 35.2 C74 36.6 73.3 37.9 72.1 38.7 L61.2 46.5 C59.8 47.5 59.8 49.5 61.2 50.5 L72.1 58.3 C73.3 59.1 74 60.4 74 61.8 L74 74.2 C73.7 76.7 70.8 77.7 69 76 L49.4 53.6 C47.5 51.5 47.5 48.5 49.4 46.4 Z" fill="url(#logoCyanRTLW)"/>
      <!-- Emerald Node -->
      <circle cx="78" cy="50" r="5.5" fill="url(#logoSparkRTLW)"/>
      <circle cx="78" cy="50" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography Brand Text (Persian RTL aligned to the Right - Light for Dark Backgrounds) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Vazirmatn', 'IranSans', 'Segoe UI', Tahoma, sans-serif" direction="rtl">
    <!-- Main Persian Title -->
    <text x="348" y="44" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5">
      نرخنگار
    </text>

    <!-- Sub-brand Tagline -->
    <text x="348" y="68" font-size="12.5" font-weight="500" fill="#94A3B8" text-anchor="start">
      افزونه استعلام قیمت و پیش‌فاکتور رسمی ماده ۱۶۹ ووکامرس
    </text>

    <!-- Badges -->
    <g transform="translate(14, 26)">
      <rect x="0" y="0" width="108" height="22" rx="6" fill="rgba(34, 113, 177, 0.25)" stroke="#38BDF8" stroke-width="1"/>
      <text x="54" y="15" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">
        سازگار با WC 9
      </text>
    </g>

    <g transform="translate(14, 54)">
      <rect x="0" y="0" width="108" height="22" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
      <text x="54" y="15" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">
        بله • ایتا • پیامک
      </text>
    </g>
  </g>
</svg>