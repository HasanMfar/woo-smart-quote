<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 140px;
    height: 140px;
    background: transparent;
    overflow: hidden;
  }
  .brand-emblem {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 140px;
    height: 140px;
    background: linear-gradient(145deg, #2563eb 0%, #1d4ed8 48%, #0b234f 100%);
    border-radius: 36px;
    box-shadow: 
      0 20px 44px -8px rgba(29, 78, 216, 0.58),
      inset 0 1.5px 1px rgba(255, 255, 255, 0.45),
      inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
</style>
</head>
<body>
<div class="brand-emblem">
  <svg width="104" height="104" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- White Chevron: Pure white with soft icy gradient -->
    <linearGradient id="chvWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Cyan Chevron: Vibrant Electric Cyan to Cerulean -->
    <linearGradient id="chvCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Emerald Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Multi-stage drop shadow for floating depth -->
    <filter id="chvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#06152D" flood-opacity="0.5"/>
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#chvShadow)">
    <!-- Primary Chevron (Left - Radiant Pure White, First Quotation Blade / Buyer Inquiry) -->
    <path d="M43 21 
             C44.8 19.3 47.7 20.3 48 22.8 
             L48 35.2 
             C48 36.6 47.3 37.9 46.1 38.7 
             L35.2 46.5 
             C33.8 47.5 33.8 49.5 35.2 50.5 
             L46.1 58.3 
             C47.3 59.1 48 60.4 48 61.8 
             L48 74.2 
             C47.7 76.7 44.8 77.7 43 76 
             L23.4 53.6 
             C21.5 51.5 21.5 48.5 23.4 46.4 
             Z" 
          fill="url(#chvWhite)"/>

    <!-- Secondary Chevron (Right - Electric Cyan Azure, Official Quote / Proforma Issuance) -->
    <path d="M69 21 
             C70.8 19.3 73.7 20.3 74 22.8 
             L74 35.2 
             C74 36.6 73.3 37.9 72.1 38.7 
             L61.2 46.5 
             C59.8 47.5 59.8 49.5 61.2 50.5 
             L72.1 58.3 
             C73.3 59.1 74 60.4 74 61.8 
             L74 74.2 
             C73.7 76.7 70.8 77.7 69 76 
             L49.4 53.6 
             C47.5 51.5 47.5 48.5 49.4 46.4 
             Z" 
          fill="url(#chvCyan)"/>
  </g>

  <!-- Official Tax 169 & Calculation Verification Node -->
  <g filter="url(#sparkGlow)">
    <circle cx="78" cy="50" r="5.5" fill="url(#sparkGrad)"/>
    <circle cx="78" cy="50" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
</div>
</body>
</html>
