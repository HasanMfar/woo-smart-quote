  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 2100px;
    height: 1040px;
    overflow: hidden;
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    background: #07152b;
    color: #ffffff;
  }

  .canvas {
    position: relative;
    width: 2100px;
    height: 1040px;
    background: linear-gradient(135deg, #050f1d 0%, #0a2140 50%, #061324 100%);
    overflow: hidden;
    display: flex;
    direction: ltr; /* Left is screenshots, Right is typography */
  }

  /* Right column (Brand Typography & Features) */
  .right-col {
    position: relative;
    z-index: 10;
    width: 1060px;
    height: 1040px;
    padding: 70px 80px 70px 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    direction: rtl;
    text-align: right;
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(56, 189, 248, 0.12);
    border: 1.5px solid rgba(56, 189, 248, 0.45);
    padding: 8px 22px;
    border-radius: 100px;
    width: fit-content;
  }
  .tag-pill .pill-text {
    font-size: 19px;
    font-weight: 800;
    color: #38bdf8;
    letter-spacing: -0.2px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .brand-logo-img {
    width: 100px;
    height: 100px;
    border-radius: 24px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
  }
  .brand-name {
    font-size: 88px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -2px;
    text-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
  }

  /* Single punchy subtitle: <= 5 words */
  .punchy-subtitle {
    font-size: 32px;
    font-weight: 800;
    color: #e2e8f0;
    line-height: 1.3;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  /* High-Contrast Feature Box: Solid white card clearly differing from the dark canvas, crystal readable at 350px thumbnail */
  .amber-box {
    background: #ffffff;
    border: 3.5px solid #f59e0b;
    border-radius: 24px;
    padding: 28px 36px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.8);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .amber-box-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 2px solid #fef3c7;
  }
  .amber-box-title {
    font-size: 26px;
    font-weight: 900;
    color: #b45309;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: -0.3px;
  }

  /* Single clean column of 4 features with large font (>= 50px bold) */
  .features-column {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .feature-item {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .feature-check {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #f59e0b;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
  }
  .feature-text {
    font-size: 52px;
    font-weight: 900;
    color: #0f172a;
    white-space: nowrap;
    line-height: 1.15;
    letter-spacing: -0.5px;
  }

  /* Left column: Real Screenshots Showcase */
  .left-col {
    position: relative;
    width: 1040px;
    height: 1040px;
    overflow: hidden;
  }

  /* Dashboard screenshot in background (angled) */
  .dash-frame {
    position: absolute;
    top: 75px;
    left: 40px;
    width: 820px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 0 1.5px rgba(255, 255, 255, 0.15);
    transform: rotate(-3deg);
    transition: transform 0.3s;
  }
  .dash-frame img {
    width: 100%;
    display: block;
  }

  /* PDF Proforma in foreground */
  .pdf-frame {
    position: absolute;
    top: 130px;
    left: 450px;
    width: 530px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(56, 189, 248, 0.4);
    transform: rotate(2deg);
    background: #ffffff;
  }
  .pdf-frame img {
    width: 100%;
    display: block;
  }

</style>
