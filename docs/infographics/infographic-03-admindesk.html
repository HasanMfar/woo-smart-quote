  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 960px;
    height: 860px;
    overflow: hidden;
    font-family: 'Vazirmatn', sans-serif;
    background: #FAF7F0;
    color: #1e293b;
    direction: rtl;
    text-align: right;
  }

  .slice-container {
    position: relative;
    width: 960px;
    height: 860px;
    padding: 34px 44px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #FAF7F0;
  }

  /* Section Title Bar */
  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #e0f2fe;
    border: 1px solid #7dd3fc;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    color: #0284c7;
    width: fit-content;
    margin-bottom: 8px;
  }

  .section-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.35;
    color: #0f172a;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
