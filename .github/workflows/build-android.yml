name: Build & Sign Android Companion App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Detect App Directory & Install Dependencies
        id: app-dir
        run: |
          if [ -f "pubspec.yaml" ]; then
            APP_DIR="."
          elif [ -f "wsq_companion/pubspec.yaml" ]; then
            APP_DIR="wsq_companion"
          else
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_OUTPUT"
          cd "$APP_DIR"
          flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          cd "${{ steps.app-dir.outputs.APP_DIR }}"
          flutter analyze --no-fatal-infos
          flutter test --exclude-tags=golden

      - name: Decode Android Keystore & Configure Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "${{ steps.app-dir.outputs.APP_DIR }}"
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Refusing to build a release that would be debug-signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::Decoded keystore is empty; check KEYSTORE_BASE64."
            exit 1
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "Keystore decoded and android/key.properties configured."

      - name: Build Signed Universal & Split APKs
        run: |
          cd "${{ steps.app-dir.outputs.APP_DIR }}"
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Build Signed Android App Bundle (AAB)
        run: |
          cd "${{ steps.app-dir.outputs.APP_DIR }}"
          flutter build appbundle --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            **/build/app/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ secrets.PUBLIC_RELEASE_REPO || 'HasanMfar/nerkhnegar-companion-releases' }}
          token: ${{ secrets.PUBLIC_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: «نرخنگار» اپلیکیشن همراه اندروید (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'نسخه ۱.۰.۰' }})
          body: |
            <div dir="rtl">

            **اپلیکیشن همراه «نرخنگار» — ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'نسخه ۱.۰.۰' }}**

            مدیریت استعلام‌ها، قیمت‌گذاری اقلام و ارسال پیش‌فاکتور از روی گوشی، متصل به همان فروشگاه ووکامرسی که افزونه نرخنگار روی آن نصب است.

            ### کدام فایل را نصب کنم؟

            | فایل | مناسب برای |
            | --- | --- |
            | `app-arm64-v8a-release.apk` | تقریباً همه گوشی‌های امروزی (پیشنهادی) |
            | `app-armeabi-v7a-release.apk` | گوشی‌های قدیمی‌تر ۳۲ بیتی |
            | `app-x86_64-release.apk` | شبیه‌ساز اندروید و کروم‌بوک |
            | `app-release.apk` | نسخه یونیورسال؛ اگر مطمئن نیستید کدام را بردارید |
            | `app-release.aab` | مخصوص انتشار در فروشگاه اپلیکیشن (Google Play) |

            ### مراحل نصب

            ۱. فایل APK مناسب را دانلود کنید.
            ۲. اگر اندروید هشدار داد، اجازه «نصب از منابع نامشخص» را برای مرورگر یا فایل‌منیجر فعال کنید.
            ۳. پس از نصب، آدرس فروشگاه و کد جفت‌سازی را از پیشخوان وردپرس (تب «اپلیکیشن همراه») وارد کنید.

            حداقل نسخه اندروید: ۶ (API 23). این نسخه با کلید امضای جدید امضا شده است؛ اگر نسخه آزمایشی قدیمی را نصب کرده‌اید، ابتدا آن را حذف کنید.

            </div>
          draft: false
          prerelease: false
          files: |
            ${{ steps.app-dir.outputs.APP_DIR }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ steps.app-dir.outputs.APP_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ steps.app-dir.outputs.APP_DIR }}/build/app/outputs/flutter-apk/app-x86_64-release.apk
            ${{ steps.app-dir.outputs.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.app-dir.outputs.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
