name: wsq_companion
description: "WooCommerce Smart Quote Official Companion App for Store Managers"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.7.0

  # Storage & Offline Cache
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR Code Scanning
  mobile_scanner: ^5.2.3

  # Background Sync & Notifications (No Firebase dependency)
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.svg

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
